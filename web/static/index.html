<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบพยากรณ์โปรไฟล์การใช้ไฟฟ้า — No AMR</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="root">

    <header class="header">
      <div class="header-brand">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        </div>
        <div class="header-titles">
          <div class="header-title">ระบบพยากรณ์โปรไฟล์การใช้ไฟฟ้า</div>
          <div class="header-subtitle">โครงการ No AMR — สำหรับผู้ใช้ไฟที่ยังไม่มีข้อมูลมิเตอร์ AMR ของตัวเอง</div>
        </div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;">
        <a href="/new-forecast" style="font-size:13px;color:#2a78d6;text-decoration:none;">พยากรณ์แบบไม่บันทึกข้อมูล →</a>
        <a href="/admin" style="font-size:13px;color:#2a78d6;text-decoration:none;">นำเข้า AMR (Admin) →</a>
      </div>
    </header>

    <main class="body-wrap">

      <!-- Search -->
      <section class="search-block">
        <label class="search-label" for="search-input">ค้นหาผู้ใช้ไฟ</label>
        <div class="search-row">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8996ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" type="text" placeholder="เลขบัญชีผู้ใช้ไฟ หรือ ชื่อ" autocomplete="off" list="customer-list">
            <datalist id="customer-list"></datalist>
          </div>
          <button id="search-btn" class="search-button">ค้นหา</button>
        </div>
        <div id="search-hint" class="search-hint"></div>
      </section>

      <div id="result" class="result-area"></div>

      <div id="empty-state" class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8996ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div>พิมพ์เลขบัญชีผู้ใช้ไฟแล้วกด "ค้นหา" เพื่อดูผลพยากรณ์</div>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
